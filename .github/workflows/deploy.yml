name: Deploy to EC2

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: r2alisshoman/fastapi-assignment-3:${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^r2alisshoman/fastapi-assignment-3:[0-9a-f]{40}$ ]]

          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"

          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -i "$ssh_dir/key" \
            "$EC2_USER@$EC2_HOST" "bash -se -- '$IMAGE'" <<'REMOTE'
          image="$1"
          sudo -n docker pull "$image"
          if sudo -n docker container inspect fastapi-assignment-3 >/dev/null 2>&1; then
            sudo -n docker rm -f fastapi-assignment-3
          fi
          sudo -n docker run -d --name fastapi-assignment-3 \
            --restart unless-stopped -p 80:8000 "$image"
          REMOTE

      - name: Verify public health and source hash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.request import urlopen
          from src.common.source_hash import get_all_src_py_files_hash

          expected = get_all_src_py_files_hash()
          url = f"http://{os.environ['EC2_HOST']}/health"

          for attempt in range(12):
              try:
                  with urlopen(url, timeout=5) as response:
                      body = json.load(response)
                      if (
                          response.status != 200
                          or not isinstance(body, dict)
                          or body.get("status") != "ok"
                          or body.get("hash") != expected
                      ):
                          raise ValueError("Unexpected health response or source hash")
                  print("Health and source hash verified")
                  break
              except (OSError, ValueError) as exc:
                  if attempt == 11:
                      raise SystemExit(f"Deployment check failed: {exc}") from exc
                  time.sleep(5)
          PY
